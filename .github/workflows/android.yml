# App Android : compilation, tests et APK de développement à chaque push touchant le code qu'elle embarque.
# (Les releases sur main publient l'APK : voir package.yml.)
name: Android

on:
  push:
    paths:
      - "android/**"
      - "api/**"
      - "core/**"
      - "plugins/synth/**"
      - "plugins/soundboard/**"
      - "web/**"
      - "buildSrc/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "package*.json"
      - ".github/workflows/android.yml"
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: APK de développement + tests
        run: bash ./gradlew -Pandroid=true :android:assembleDebug :android:testDebugUnitTest --no-configuration-cache --stacktrace

      - name: Contenu de l'APK (interface, pages des plugins embarqués)
        run: |
          apk=$(ls android/build/outputs/apk/debug/*.apk)
          unzip -l "$apk" > apk.txt
          for f in ui/index.html assets/plugins/synth/plugin.json assets/plugins/synth/web/index.html \
                   assets/plugins/soundboard/plugin.json assets/plugins/soundboard/web/index.html classes.dex; do
            grep -q " $f\$" apk.txt || { echo "::error::$f absent de l'APK"; exit 1; }
          done
          ! grep -qE " (plugin\.json|web/index\.html)$" apk.txt || { echo "::error::ressources de plugin à la racine de l'APK"; exit 1; }
          ls -la "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: APCDeck-Android-debug
          path: android/build/outputs/apk/debug/*.apk

  # Pas d'appareil Android sous la main : l'APK est installé et testé sur un émulateur (voir android-smoke.sh).
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: APCDeck-Android-debug
          path: apk

      - name: Accès à KVM (accélération de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test de fumée sur émulateur (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/android-smoke.sh apk/android-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: APCDeck-Android-emulateur
          path: screen.png
          if-no-files-found: ignore
