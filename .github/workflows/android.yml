# App Android : compilation, tests et APK de développement à chaque push touchant le code qu'elle embarque.
# (Les releases sur main publient l'APK : voir package.yml.)
name: Android

on:
  push:
    paths:
      - "android/**"
      - "api/**"
      - "core/**"
      - "plugins/synth/**"
      - "plugins/soundboard/**"
      - "web/**"
      - "buildSrc/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "package*.json"
      - ".github/workflows/android.yml"
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Versions de l'Android Gradle Plugin publiées
        continue-on-error: true
        run: curl -s https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml | grep -oE "<version>[0-9]+\.[0-9]+\.[0-9]+</version>" | tail -8

      - name: APK de développement + tests
        run: bash ./gradlew -Pandroid=true :android:assembleDebug :android:testDebugUnitTest --no-configuration-cache --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: APCDeck-Android-debug
          path: android/build/outputs/apk/debug/*.apk
