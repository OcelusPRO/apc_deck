# Release automatique : chaque commit sur main (ou master) construit les exécutables Windows, Linux et macOS
# (jpackage ne fait pas de compilation croisée : chaque OS est construit sur sa propre machine) et publie une
# release GitHub v<version>. L'application installée la trouve toute seule (Updater : releases/latest).
#
# Version : appVersion de gradle.properties, dernier nombre remplacé par le numéro du build (1.0.0 -> 1.0.42).
# Le développement se fait sur la branche dev (workflow ci.yml : tests seulement).
name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Deux commits rapprochés : les releases sortent dans l'ordre, l'une après l'autre.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(grep -E '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=${base%.*}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION_ARG: -PappVersion=${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: bash ./gradlew build --no-configuration-cache $VERSION_ARG
        shell: bash

      - name: Archive portable + installeur
        # L'installeur .exe Windows nécessite WiX : présent sur les machines windows-latest de GitHub.
        run: bash ./gradlew :app:packageApp :app:packageInstaller --no-configuration-cache $VERSION_ARG
        shell: bash

      - name: Jar multi-plateforme + plugins officiels (<id>.jar, pour leur mise à jour)
        if: matrix.os == 'ubuntu-latest'
        run: bash ./gradlew :app:packageJar :app:packagePlugins --no-configuration-cache $VERSION_ARG
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: APCDeck-${{ runner.os }}
          path: app/build/dist/*

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # APK signé si la clé est fournie (secrets APCDECK_KEYSTORE_BASE64, APCDECK_KEYSTORE_PASSWORD, APCDECK_KEY_ALIAS,
      # APCDECK_KEY_PASSWORD) : toujours la même clé, sinon Android refuse d'installer une mise à jour par-dessus.
      # Sans clé : APK de développement (installable, mais signé par une clé propre à chaque build).
      - name: APK
        env:
          KEYSTORE_BASE64: ${{ secrets.APCDECK_KEYSTORE_BASE64 }}
          APCDECK_KEYSTORE_PASSWORD: ${{ secrets.APCDECK_KEYSTORE_PASSWORD }}
          APCDECK_KEY_ALIAS: ${{ secrets.APCDECK_KEY_ALIAS }}
          APCDECK_KEY_PASSWORD: ${{ secrets.APCDECK_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/apcdeck.jks"
            export APCDECK_KEYSTORE="$RUNNER_TEMP/apcdeck.jks"
            bash ./gradlew -Pandroid=true -PappVersion=$VERSION :android:assembleRelease --no-configuration-cache
            cp android/build/outputs/apk/release/*.apk "dist/APCDeck-$VERSION-android.apk"
          else
            bash ./gradlew -Pandroid=true -PappVersion=$VERSION :android:assembleDebug --no-configuration-cache
            cp android/build/outputs/apk/debug/*.apk "dist/APCDeck-$VERSION-android-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: APCDeck-Android
          path: dist/*

  release:
    needs: [version, package, android]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "APC Deck $VERSION" --generate-notes
