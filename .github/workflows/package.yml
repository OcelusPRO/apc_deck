# Construit les exécutables Windows, Linux et macOS (jpackage ne fait pas de compilation croisée :
# chaque OS est construit sur sa propre machine). Déclenchement : à la main, ou sur un tag v*.
name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: bash ./gradlew build --no-configuration-cache
        shell: bash

      - name: Archive portable + installeur
        # L'installeur .exe Windows nécessite WiX : présent sur les machines windows-latest de GitHub.
        run: bash ./gradlew :app:packageApp :app:packageInstaller --no-configuration-cache
        shell: bash

      - name: Jar multi-plateforme
        if: matrix.os == 'ubuntu-latest'
        run: bash ./gradlew :app:packageJar --no-configuration-cache
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: APCDeck-${{ runner.os }}
          path: app/build/dist/*
